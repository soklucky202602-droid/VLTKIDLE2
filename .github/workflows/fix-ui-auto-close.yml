name: Fix UI auto-close

on:
  push:
    branches: [main]

jobs:
  patch-ui:
    if: ${{ !contains(github.event.head_commit.message, 'fix: prevent UI auto-close') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI error handling
        shell: python
        run: |
          from pathlib import Path
          p = Path("app.js")
          s = p.read_text(encoding="utf-8")
          old = 'yt=function(A,n){try{n(),x3=Math.max(0,x3-.02)}catch(t){x3++;const e=A+": "+(t&&t.message);e!==Jh&&(Jh=e,console.error("[loi vong lap]",A,t)),x3>30&&(x3=0,c.fx=[],c.txt=[],c.enemies=[],c.spawnT=.5,c.deadT=0,R2=0,c.quiet=!1,t0(!0))}}'
          new = 'yt=function(A,n){try{n(),x3=Math.max(0,x3-.02)}catch(t){x3++;const e=A+": "+(t&&t.message);e!==Jh&&(Jh=e,console.error("[loi vong lap]",A,t)),x3>30&&(x3=0,c.fx=[],c.txt=[],c.enemies=[],c.spawnT=.5,c.deadT=0,R2=0,c.quiet=!1,A!=="giao dien"&&t0(!0))}}'
          if old in s:
              s = s.replace(old, new, 1)
          old2 = 'const A=c.potCd||{},n=(t,e,a)=>t&&t.querySelector(".cd").style.setProperty("--p",`${C(e/a,0,1)*100}%`);'
          new2 = 'const A=c.potCd||{},n=(t,e,a)=>{const r=t&&t.querySelector(".cd");r&&r.style.setProperty("--p",`${C(e/a,0,1)*100}%`)};'
          if old2 in s:
              s = s.replace(old2, new2, 1)
          if s == p.read_text(encoding="utf-8"):
              raise SystemExit("No UI patch target found")
          p.write_text(s, encoding="utf-8")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent UI auto-close"
          git push
