name: Rebirth source fix v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout 66778ee794f7d9b2d97852e9e7239ac87ea76232 -- app.js
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('Math.min(10,o.rw.stat.reborn||0)','Math.max(0,Math.min(50,o.rw.stat.reborn||0))',1)
          s=s.replace('OA=()=>o.lvl+T3*v0()','OA=()=>o.lvl',1)
          a=s.index('R5=function(){'); b=s.index(',QD=function',a)
          block='''R5=function(){return{hp:1,dmg:1}},mi=function(){const A=o.rw&&o.rw.stat&&o.rw.stat.reborn||0;return{xp:.2*A,dmg:.1*A}},zD=async function(){const A=Q(),n=A.stat.reborn|0,t=n+1,e=RB_REQ(n);if(t>REBORN_MAX||o.lvl<e)return;const a=await dt(`Chuyển sinh lần ${t}: về cấp 1, giữ nguyên trang bị và toàn bộ võ công.\\n\\nNhận ${t*50} điểm tiềm năng và +1 điểm Tâm pháp.\\nThưởng vĩnh viễn +${t*20}% kinh nghiệm, +${t*10}% sát thương.\\n\\nTiếp tục?`);if(!a)return;A.stat.reborn=t,o.lvl=1,o.xp=0,o.attr={str:0,dex:0,vit:0,eng:0},o.attrPts=t*50,o.stage=1,o.wave=1,o.push=!0,o.tpPend=(o.tpPend|0)+1,c.tower=null,c.enemies=[],c.dirty=!0,c.zoneShown=null,M(`<b class="up">Chuyển sinh lần ${t}!</b> +${t*20}% kinh nghiệm, +${t*10}% sát thương`),ln(),t0(!0),F(),B()}'''
          s=s[:a]+block+s[b:]
          a=s.index('JD=function'); b=s.index(',ne=function',a)
          jd="""JD=function(A=Q()){const n=mi(),t=A.stat.reborn|0,e=t+1,a=RB_REQ(t),i=t>=REBORN_MAX;return`<p class=\"desc\">Đạt <b>cấp ${a}</b>: về cấp 1, giữ nguyên trang bị và toàn bộ võ công. Mỗi lần nhận <b>${e*50} điểm tiềm năng</b> và +1 điểm Tâm pháp. Thưởng vĩnh viễn <b>+${e*20}% kinh nghiệm, +${e*10}% sát thương</b>. Tối đa ${REBORN_MAX} lần chuyển sinh.</p><p>Đã chuyển sinh: <b>${t}</b> lần · hiện <b>+${Math.round(n.xp*100)}% kinh nghiệm</b>, <b>+${Math.round(n.dmg*100)}% sát thương</b>${i?\" · đã đạt tối đa CS50\":\" · lần tiếp theo: CS \"+e+\" · cần cấp \"+a}.</p><div class=\"btnrow\"><button class=\"btn red\" id=\"gReborn\" ${o.lvl>=a&&!i?\"\":\"disabled\"}>${i?\"Đã chuyển sinh tối đa\":o.lvl>=a?\"Chuyển sinh\":`Cần cấp ${a}`}</button></div>`}"""
          s=s[:a]+jd+s[b:]
          a=s.index('Rd=function'); b=s.index(',za=',a)
          s=s[:a]+'Rd=function(){o.fac&&J(`<h3>Chuyển sinh <small>${Q().stat.reborn}/${REBORN_MAX} lần</small></h3>${JD()}`,()=>{const A=u("#gReborn");A&&(A.onclick=zD)})}'+s[b:]
          marker='Yd=1800,Fd=300,gt=200,P2=10,n1=10,'
          assert marker in s
          s=s.replace(marker,'Yd=1800,Fd=300,REBORN_LV=120,REBORN_STEP=20,REBORN_MAX=50,RB_REQ=s=>REBORN_LV+(s|0)*REBORN_STEP,gt=200,P2=10,n1=10,',1)
          s=s.replace('o.lvl>=gt&&Q().stat.reborn<P2?" on":""','o.lvl>=RB_REQ(Q().stat.reborn)&&Q().stat.reborn<REBORN_MAX?" on":""')
          s=s.replace('C(G(n,"manashield_p"),0,90)','C(G(n,"manashield_p"),0,99)',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); p.write_text(p.read_text(encoding='utf-8').replace('<script src="rebirth-vltkzip.js?v=4"></script>',''),encoding='utf-8')
          PY
          git rm -f rebirth-vltkzip.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html
          git commit -m 'fix: sync rebirth with character state'
          git push
