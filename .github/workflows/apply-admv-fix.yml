name: apply-admv-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('oh="jxidle_sbvia",ly=s=>/timeout|timed out|fetch|network|503|502|504|520|522|524|544|too many|overload|connection|failed to/i.test(String(s&&(s.message||s.code||s.status)||s)),L2=()=>Date.now()<(k.holdUntil||0),lr=()=>o?[o.lvl,Math.floor(o.xp||0),o.gold,o.knb|0,(o.inv||[]).length,o.uid,(o.rw&&o.rw.stat&&o.rw.stat.towerBest)|0].join("|"):"",p0=async s=>{',
             'oh="jxidle_sbvia",ly=s=>/timeout|timed out|fetch|network|503|502|504|520|522|524|544|too many|overload|connection|failed to/i.test(String(s&&(s.message||s.code||s.status)||s)),L2=()=>Date.now()<(k.holdUntil||0),lr=()=>o?[o.lvl,Math.floor(o.xp||0),o.gold,o.knb|0,(o.inv||[]).length,o.uid,(o.rw&&o.rw.stat&&o.rw.stat.towerBest)|0].join("|"):"",SVR={exp:1,gold:1,drop:1,maintenance:!1,last:0},loadServerSettings=async()=>{try{const A=await l3(),{data:n,error:t}=await A.from("game_settings").select("key,value");if(t)throw t;const e={exp:1,gold:1,drop:1,maintenance:!1};for(const r of n||[]){const l=r&&r.value||{},d=typeof l.value==="number"?l.value:parseFloat(l.value);r.key==="exp_multiplier"&&Number.isFinite(d)&&(e.exp=Math.max(.01,d));r.key==="gold_multiplier"&&Number.isFinite(d)&&(e.gold=Math.max(.01,d));r.key==="drop_multiplier"&&Number.isFinite(d)&&(e.drop=Math.max(.01,d));r.key==="maintenance"&&typeof l.enabled==="boolean"&&(e.maintenance=l.enabled)}SVR.exp=e.exp,SVR.gold=e.gold,SVR.drop=e.drop,SVR.maintenance=e.maintenance,SVR.last=Date.now(),window.MAINT=SVR.maintenance}catch{}return SVR},p0=async s=>{'),
            ('}catch{k.user=null}return t.auth.onAuthStateChange((e,a)=>{if(a&&a.user)k.user=a.user;else if(e==="SIGNED_OUT"){',
             '}catch{k.user=null}return t.auth.onAuthStateChange((e,a)=>{if(a&&a.user)k.user=a.user,loadServerSettings().catch(()=>{});else if(e==="SIGNED_OUT"){'),
            ('d3()}),k.sb=t,t})().catch',
             'd3()}),k.sb=t,loadServerSettings().catch(()=>{}),setInterval(()=>loadServerSettings().catch(()=>{}),3e4),t})().catch'),
            ('const t=A*Vt*(1+(o.tanthuXp&&!(v0()>0)?+o.tanthuXp:0))*(1+mi().xp+(c.P&&c.P.expPct?c.P.expPct/100:0))',
             'const t=A*Vt*(SVR.exp||1)*(1+(o.tanthuXp&&!(v0()>0)?+o.tanthuXp:0))*(1+mi().xp+(c.P&&c.P.expPct?c.P.expPct/100:0))'),
            ('const n=A.L-o.lvl,t=n<-10?.2:n<-5?.6:1,e=X4(nc(A.L)*dc(o.lvl,A.L)*(typeof vr=="function"?vr():1)*Pa[A.cls].xp*h6()*t*J4().rew),a=c.tower?0:Math.round(Km(A)*J4().rew);',
             'const n=A.L-o.lvl,t=n<-10?.2:n<-5?.6:1,e=X4(nc(A.L)*dc(o.lvl,A.L)*(typeof vr=="function"?vr():1)*Pa[A.cls].xp*h6()*t*J4().rew),a=Math.round(Km(A)*J4().rew*(SVR.gold||1));'),
            ('Math.random()<du*a*Os(A)*e?1:0','Math.random()<Math.min(1,du*a*Os(A)*e*(SVR.drop||1))?1:0'),
            ('Math.random()<(il[A.cls]??il.normal)*a*Os(A)*(A.bonusDrop||1)','Math.random()<Math.min(1,(il[A.cls]??il.normal)*a*Os(A)*(A.bonusDrop||1)*(SVR.drop||1))'),
            ('Math.random()<$s("ore",A)','Math.random()<Math.min(1,$s("ore",A)*(SVR.drop||1))'),
            ('Math.random()<$s("ht",A)','Math.random()<Math.min(1,$s("ht",A)*(SVR.drop||1))'),
            ('Math.random()<(Hw[A.cls]||0)*da()','Math.random()<Math.min(1,(Hw[A.cls]||0)*da()*(SVR.drop||1))'),
            ('!n&&Math.random()>=$s("shard",A)*Ue("shard")*t','!n&&Math.random()>=Math.min(1,$s("shard",A)*Ue("shard")*t*(SVR.drop||1))'),
            ('Math.random()<$s("wc",A)','Math.random()<Math.min(1,$s("wc",A)*(SVR.drop||1))'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('missing expected source fragment')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm .github/workflows/apply-admv-fix.yml
          git commit -m "Fix ADMV multipliers for EXP gold and Tower drops"
          git push
