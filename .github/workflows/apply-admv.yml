name: Apply ADMV gameplay settings
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch drop rate and tower combat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('*(SVR.drop||1)*(c.tower?3:1)','')
          s=s.replace('*(SVR.drop||1)','')
          new='da=()=>((1+(typeof u2==="function"?u2("drop"):0))*(1+.1*v0())*(1+Math.min(100,Math.max(0,c.P?c.P.lucky:0))*.005))*(SVR.drop||1)*(c.tower?3:1)'
          s,n=re.subn(r'da=\(\)=>.*?(?=,il=)',new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('da not found')
          s=s.replace('$s("shard",A)*Ue("shard")*t)','$s("shard",A)*Ue("shard")*t*(SVR.drop||1)*(c.tower?3:1))',1)
          if s.count('SVR.drop||1')<2: raise SystemExit('drop multiplier missing')

          # Never reset a live tower wave from LD().
          start=s.find('LD=function(){')
          if start < 0: raise SystemExit('LD function not found')
          reset=s.find('c.enemies=[]',start)
          if reset < 0: raise SystemExit('tower enemy reset not found')
          guard='if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;'
          if guard not in s[max(start,reset-200):reset]:
            s=s[:reset]+guard+s[reset:]

          # The anti-stall branch is minified and may vary slightly. Remove
          # only a branch that clears c.stallHp and immediately calls qa(!1).
          pat=r'(c\.stallHp=null,)(qa\(!1\);return)'
          s,n=re.subn(pat,r'\1return',s,count=1)
          if n!=1:
            pat=r'(c\.stallHp=null;)(qa\(!1\);return)'
            s,n=re.subn(pat,r'\1return',s,count=1)
          if n!=1: raise SystemExit('tower stall exit branch not found')

          p.write_text(s,encoding='utf-8')
          ip=Path('index.html')
          h=ip.read_text(encoding='utf-8')
          h=re.sub(r'app\.js\?v=\d+','app.js?v=562',h,count=1)
          ip.write_text(h,encoding='utf-8')
          PY
          node --check app.js
      - name: Verify tower lifecycle patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          if 'if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;' not in s:
            raise SystemExit('tower reset guard missing')
          if 'c.stallHp=null,qa(!1);return' in s or 'c.stallHp=null;qa(!1);return' in s:
            raise SystemExit('tower stall exit still present')
          print('Tower lifecycle patch OK')
          print('LD count',s.count('LD=function(){'))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: robustly disable tower stall exit"
          git push
