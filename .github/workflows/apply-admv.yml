name: Apply ADMV gameplay settings
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tower progression and combat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          start=s.find('LD=function(){')
          if start < 0:
              raise SystemExit('LD function not found')
          end=s.find('};', start)
          if end < 0:
              raise SystemExit('LD function end not found')
          tower=s[start:end]
          changed=False
          if 'n=Wd(A)' in tower:
              tower=tower.replace('n=Wd(A)','n=8+Math.round(A*1.8)',1); changed=True
          if 'i=rP(A)' in tower:
              tower=tower.replace('i=rP(A)','i={hp:1+A*.035,dmg:1+(A*.035)*.6}',1); changed=True
          if 'if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;' not in tower:
              reset=tower.find('c.enemies=[]')
              if reset >= 0:
                  tower=tower[:reset]+'if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;'+tower[reset:]; changed=True
          s=s[:start]+tower+s[end:]
          if 'c.stallHp=null,qa(!1);return' in s:
              s=s.replace('c.stallHp=null,qa(!1);return','c.stallHp=null;return',1); changed=True
          elif 'c.stallHp=null;qa(!1);return' in s:
              s=s.replace('c.stallHp=null;qa(!1);return','c.stallHp=null;return',1); changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
          ip=Path('index.html')
          h=ip.read_text(encoding='utf-8')
          h2=re.sub(r'app\.js\?v=\d+','app.js?v=563',h,count=1)
          if h2 != h:
              ip.write_text(h2,encoding='utf-8'); changed=True
          print('Tower patch applied' if changed else 'Tower already up to date')
          PY
          node --check app.js
      - name: Verify tower progression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          checks={
            'unlimited tower level formula':'n=8+Math.round(A*1.8)',
            'tower scaling formula':'i={hp:1+A*.035,dmg:1+(A*.035)*.6}',
            'tower reset guard':'if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;',
          }
          for name,needle in checks.items():
              if needle not in s: raise SystemExit(name+' missing')
          if 'c.stallHp=null,qa(!1);return' in s or 'c.stallHp=null;qa(!1);return' in s:
              raise SystemExit('tower stall exit still present')
          print('Tower progression OK')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "feat: apply 2000-floor tower progression"
          git push
