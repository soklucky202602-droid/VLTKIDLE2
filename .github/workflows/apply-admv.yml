name: Apply ADMV gameplay settings
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tower progression and combat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          # Reference Tower progression: 2000 floors, uncapped monster level,
          # 3.5% HP growth per floor, and 60% of HP growth for damage.
          start=s.find('LD=function(){')
          if start < 0:
              raise SystemExit('LD function not found')
          end=s.find('};', start)
          if end < 0:
              raise SystemExit('LD function end not found')
          tower=s[start:end]
          if 'n=Wd(A)' not in tower:
              raise SystemExit('tower level expression not found')
          if 'i=rP(A)' not in tower:
              raise SystemExit('tower multiplier expression not found')
          tower=tower.replace('n=Wd(A)','n=8+Math.round(A*1.8)',1)
          tower=tower.replace('i=rP(A)','i={hp:1+A*.035,dmg:1+(A*.035)*.6}',1)

          # Never reset a live tower wave from LD().
          if 'if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;' not in tower:
              reset=tower.find('c.enemies=[]')
              if reset < 0:
                  raise SystemExit('tower enemy reset not found')
              tower=tower[:reset]+'if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;'+tower[reset:]
          s=s[:start]+tower+s[end:]

          # Do not silently exit the tower from the anti-stall branch.
          old_count=s.count('c.stallHp=null,qa(!1);return')
          if old_count:
              s=s.replace('c.stallHp=null,qa(!1);return','c.stallHp=null;return',1)
          else:
              old_count=s.count('c.stallHp=null;qa(!1);return')
              if old_count:
                  s=s.replace('c.stallHp=null;qa(!1);return','c.stallHp=null;return',1)
              else:
                  raise SystemExit('tower stall exit branch not found')

          p.write_text(s,encoding='utf-8')
          ip=Path('index.html')
          h=ip.read_text(encoding='utf-8')
          h=re.sub(r'app\.js\?v=\d+','app.js?v=563',h,count=1)
          ip.write_text(h,encoding='utf-8')
          PY
          node --check app.js
      - name: Verify tower progression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          checks={
            'unlimited tower level formula':'n=8+Math.round(A*1.8)',
            'tower scaling formula':'i={hp:1+A*.035,dmg:1+(A*.035)*.6}',
            'tower reset guard':'if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;',
          }
          for name,needle in checks.items():
              if needle not in s: raise SystemExit(name+' missing')
          if 'c.stallHp=null,qa(!1);return' in s or 'c.stallHp=null;qa(!1);return' in s:
              raise SystemExit('tower stall exit still present')
          print('Tower progression OK')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "feat: apply 2000-floor tower progression"
          git push
