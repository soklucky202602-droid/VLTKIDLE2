name: Apply ADMV gameplay settings
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch drop rate and tower combat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('*(SVR.drop||1)*(c.tower?3:1)','')
          s=s.replace('*(SVR.drop||1)','')
          new='da=()=>((1+(typeof u2==="function"?u2("drop"):0))*(1+.1*v0())*(1+Math.min(100,Math.max(0,c.P?c.P.lucky:0))*.005))*(SVR.drop||1)*(c.tower?3:1)'
          s,n=re.subn(r'da=\(\)=>.*?(?=,il=)',new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('da not found')
          s=s.replace('$s("shard",A)*Ue("shard")*t)','$s("shard",A)*Ue("shard")*t*(SVR.drop||1)*(c.tower?3:1))',1)
          if s.count('SVR.drop||1')<2: raise SystemExit('drop multiplier missing')

          # Tower spawn must never clear a live wave. Only spawn again when
          # every current tower enemy is already dead/removed.
          patterns=[
            r'(LD=function\(\)\{.*?)(c\.enemies=\[\])',
            r'(towerSpawn=function\(\)\{.*?)(R\.enemies=\[\])',
          ]
          patched=False
          for pat in patterns:
            def repl(m):
              nonlocal patched
              body=m.group(1)
              reset=m.group(2)
              if 'enemies.some' in body[-500:]:
                return m.group(0)
              patched=True
              if 'c.enemies' in reset:
                guard='if(c.enemies.some(e=>e&&e.hp>0))return;'
              else:
                guard='if(R.enemies.some(e=>e&&e.hp>0))return;'
              return body+guard+reset
            s,n=re.subn(pat,repl,s,count=1,flags=re.S)
            if n:
              break
          if not patched:
            raise SystemExit('tower spawn function/reset not found')

          p.write_text(s,encoding='utf-8')
          ip=Path('index.html')
          h=ip.read_text(encoding='utf-8')
          h=re.sub(r'app\.js\?v=\d+','app.js?v=558',h,count=1)
          ip.write_text(h,encoding='utf-8')
          PY
          node --check app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: prevent tower waves from resetting during combat"
          git push
