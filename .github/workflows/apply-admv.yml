name: Apply ADMV gameplay settings
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch drop rate and tower combat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('*(SVR.drop||1)*(c.tower?3:1)','')
          s=s.replace('*(SVR.drop||1)','')
          new='da=()=>((1+(typeof u2==="function"?u2("drop"):0))*(1+.1*v0())*(1+Math.min(100,Math.max(0,c.P?c.P.lucky:0))*.005))*(SVR.drop||1)*(c.tower?3:1)'
          s,n=re.subn(r'da=\(\)=>.*?(?=,il=)',new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('da not found')
          s=s.replace('$s("shard",A)*Ue("shard")*t)','$s("shard",A)*Ue("shard")*t*(SVR.drop||1)*(c.tower?3:1))',1)
          if s.count('SVR.drop||1')<2: raise SystemExit('drop multiplier missing')

          # Keep the current tower wave alive while any enemy still has HP.
          start=s.find('LD=function(){')
          if start < 0: raise SystemExit('LD function not found')
          reset=s.find('c.enemies=[]',start)
          if reset < 0: raise SystemExit('tower enemy reset not found')
          guard='if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;'
          if guard not in s[max(start,reset-200):reset]:
            s=s[:reset]+guard+s[reset:]

          # Do not auto-exit the tower just because 45 seconds passed without
          # enough damage. That timeout was clearing the live enemy wave.
          stall='M(\'<span class="bad">🗼 45 giây không gây được sát thương đáng kể (quái hồi máu nhanh hơn) — rời tháp.</span>\'),c.stallHp=null,qa(!1);return'
          keep='M(\'<span class="bad">🗼 45 giây không gây được sát thương đáng kể (quái hồi máu nhanh hơn) — tiếp tục đánh.</span>\'),c.stallHp=null;return'
          if stall not in s: raise SystemExit('tower stall auto-exit not found')
          s=s.replace(stall,keep,1)

          p.write_text(s,encoding='utf-8')
          ip=Path('index.html')
          h=ip.read_text(encoding='utf-8')
          h=re.sub(r'app\.js\?v=\d+','app.js?v=561',h,count=1)
          ip.write_text(h,encoding='utf-8')
          PY
          node --check app.js
      - name: Verify tower lifecycle patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          checks={
            'tower reset guard':'if(c.tower&&c.enemies.some(e=>e&&e.hp>0))return;',
            'tower stall keep':'tiếp tục đánh.</span>'),c.stallHp=null;return',
          }
          for name,needle in checks.items():
            print(name, 'OK' if needle in s else 'MISSING')
            if needle not in s: raise SystemExit(name+' missing')
          print('LD count',s.count('LD=function(){'),'stall exits',s.count('qa(!1);return'))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: keep tower enemies after stall timeout"
          git push
