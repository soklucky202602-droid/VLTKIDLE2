name: Apply ADMV gameplay settings

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js'); s=p.read_text(encoding='utf-8')

          loader='''loadServerSettings=async()=>{try{if(Date.now()-((SVR&&SVR.last)||0)<5000)return SVR;const A=k.sb;if(!A)return SVR;const {data:n,error:t}=await A.from("game_settings").select("key,value");if(t)throw t;const e={exp:1,gold:1,drop:1,maintenance:!1};for(const r of n||[]){const l=r&&r.value,d=l&&typeof l==="object"&&!Array.isArray(l)&&"value" in l?l.value:l,u=l&&typeof l==="object"&&!Array.isArray(l)&&"enabled" in l?l.enabled:l,c=typeof d==="number"?d:parseFloat(d);r.key==="exp_multiplier"&&Number.isFinite(c)&&(e.exp=Math.max(.01,c));r.key==="gold_multiplier"&&Number.isFinite(c)&&(e.gold=Math.max(.01,c));r.key==="drop_multiplier"&&Number.isFinite(c)&&(e.drop=Math.max(.01,c));r.key==="maintenance"&&typeof u==="boolean"&&(e.maintenance=u)}SVR.exp=e.exp,SVR.gold=e.gold,SVR.drop=e.drop,SVR.maintenance=e.maintenance,SVR.last=Date.now(),window.MAINT=SVR.maintenance}catch{}return SVR},'''
          pat=r'loadServerSettings=async\(\)=>\{.*?\},p0=async s=>'
          s=re.sub(pat,loader+'p0=async s=>',s,count=1,flags=re.S)
          s=s.replace('p0=async s=>{if(window.MAINT)throw new Error("Máy chủ đang bảo trì");','p0=async s=>{await loadServerSettings();if(window.MAINT)throw new Error("Máy chủ đang bảo trì");',1)
          s=s.replace('return k.sb?Promise.resolve(k.sb):u0()?','return k.sb?(loadServerSettings().then(()=>k.sb)):u0()?',1)

          # ADMV EXP/GOLD + Tower EXP 3x.
          s=s.replace('A*Vt*(1+(o.tanthuXp&&!(v0()>0)?+o.tanthuXp:0))','A*Vt*(SVR.exp||1)*(1+(o.tanthuXp&&!(v0()>0)?+o.tanthuXp:0))',1)
          s=s.replace('c.tower?0:Math.round(Km(A)*J4().rew)','Math.round(Km(A)*J4().rew*(SVR.gold||1))',1)
          s=s.replace('A*Vt*(SVR.exp||1)*(1+(o.tanthuXp&&!(v0()>0)?+o.tanthuXp:0))','A*Vt*(SVR.exp||1)*(c.tower?3:1)*(1+(o.tanthuXp&&!(v0()>0)?+o.tanthuXp:0))',1)

          # Remove old direct drop multipliers first, then make da() the single source of truth.
          s=s.replace('*(SVR.drop||1)*(c.tower?3:1)','')
          s=s.replace('*(SVR.drop||1)','')
          da_new='da()=>((1+(typeof u2==="function"?u2("drop"):0))*(1+.1*v0())*(1+Math.min(100,Math.max(0,c.P?c.P.lucky:0))*.005))*(SVR.drop||1)*(c.tower?3:1)'
          da_re=r'da=\(\)=>.*?(?=,il=)'
          s,n=re.subn(da_re,da_new,s,count=1,flags=re.S)
          if n==0: raise SystemExit('common item drop function da() not found')

          # Shards have a separate probability path.
          s=s.replace('$s("shard",A)*Ue("shard")*t)','$s("shard",A)*Ue("shard")*t*(SVR.drop||1)*(c.tower?3:1))',1)

          # Tower item quality: 3x affix count, capped at 6.
          old='F6=function(A,n=1){const t=Math.random()*100-(A==="boss"?35:A==="elite"?12:0)-(c.P?c.P.lucky:0)*.5-Math.min(n,200)*.05;return t<3?E0(5,6):t<15?E0(3,4):t<50?E0(1,2):0}'
          new='F6=function(A,n=1){const t=Math.random()*100-(A==="boss"?35:A==="elite"?12:0)-(c.P?c.P.lucky:0)*.5-Math.min(n,200)*.05,q=t<3?E0(5,6):t<15?E0(3,4):t<50?E0(1,2):0;return c.tower?Math.min(6,q*3):q}'
          if old in s: s=s.replace(old,new,1)

          if s.count('SVR.drop||1') < 2: raise SystemExit('ADMV drop multiplier missing')
          if 'SVR.exp||1' not in s or 'SVR.gold||1' not in s: raise SystemExit('ADMV exp/gold multiplier missing')
          if 'return c.tower?Math.min(6,q*3):q' not in s: raise SystemExit('Tower quality multiplier missing')
          p.write_text(s,encoding='utf-8')

          ip=Path('index.html'); h=ip.read_text(encoding='utf-8'); h=re.sub(r'app\.js\?v=\d+','app.js?v=556',h,count=1); ip.write_text(h,encoding='utf-8')
          PY
          node --check app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: apply ADMV drop rate correctly"
          git push
