name: Raise level cap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch level cap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          old='X2=Math.min(200,S.exp.length),Lk=200,U2=()=>X2'
          new='X2=Math.min(1100,S.exp.length),Lk=1100,U2=()=>X2'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check app.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js
          git commit -m 'fix: allow rebirth level progression to 1100'
          git push
