name: Apply 2-criteria loot filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply loot filter patch
        run: node tools/apply-loot-filter-2criteria.js app.js

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit patched app.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply 2-criteria assistant loot filter"
          git push
