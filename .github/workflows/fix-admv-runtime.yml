name: Fix ADMV runtime loading

on:
  push:
    branches: [fix/admv-load-runtime]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admv-load-runtime
      - name: Patch app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          needle='loadServerSettings=async()=>{'
          if needle not in s:
              raise SystemExit('loadServerSettings not found')
          hook=';loadServerSettings();setInterval(()=>{if(Date.now()-(SVR.last||0)>30000)loadServerSettings()},30000);'
          if 'setInterval(()=>{if(Date.now()-(SVR.last||0)>30000)loadServerSettings()},30000)' not in s:
              marker='p0=async s=>'
              if marker not in s:
                  raise SystemExit('runtime marker not found')
              s=s.replace(marker,hook+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: load ADMV settings at runtime"
          git push origin HEAD:fix/admv-load-runtime
